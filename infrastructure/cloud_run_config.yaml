# Vision OS — Cloud Run Configuration (reference)
#
# Documents the actual live configuration of the `visionos-backend` service
# in project rux-view-497104, region us-central1 -- the ONLY production
# backend as of the Aug 2026 consolidation. Two other services (`vision-os`,
# `visionos`) existed in the same project with stale/duplicate config and
# were deleted; see git history around that date for why.
#
# NOTE: infrastructure/deploy.sh and .github/workflows/deploy.yml do NOT
# read this file -- they call `gcloud run deploy` directly, which preserves
# whatever env vars/secrets are already set on the service. This file is
# documentation of that live state, not something applied automatically.
# If you change the live service's config (via gcloud or the console),
# update this file to match, or it'll drift again.

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: visionos-backend
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "20"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 1
      timeoutSeconds: 300
      serviceAccountName: 1004956364101-compute@developer.gserviceaccount.com
      containers:
        - image: gcr.io/rux-view-497104/visionos-backend
          ports:
            - containerPort: 8080
          env:
            # Neon Postgres (not Cloud SQL -- direct asyncpg connection over
            # the internet with ssl=require)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-database-url
                  key: latest
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret-key
                  key: latest
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-telegram-bot-token
                  key: latest
            - name: TELEGRAM_CHAT_ID
              value: "5864090871"
            - name: UPSTASH_REDIS_REST_URL
              value: "https://civil-ox-146786.upstash.io"
            - name: UPSTASH_REDIS_REST_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend-upstash-redis-token
                  key: latest
            - name: GOOGLE_CLOUD_PROJECT
              value: rux-view-497104
            - name: GOOGLE_CLOUD_REGION
              value: us-central1
            - name: ENVIRONMENT
              value: production
            # RTMP ingest (connection_type="rtmp_push" cameras) -- points at
            # the MediaMTX VM in the visionos-platform GCP project (a
            # deliberately different project than this Cloud Run service's
            # rux-view-497104 -- see backend/core/ingest/rtmp_ingest.py and
            # android/SETUP.md). Not a secret, just a public IP; no auth on
            # either port yet.
            - name: RTMP_INGEST_PUSH_HOST
              value: "35.193.96.82:1935"
            - name: RTMP_INGEST_RTSP_BASE
              value: "rtsp://35.193.96.82:8554"
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
