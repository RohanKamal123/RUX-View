# Vision OS — Cloud Run Configuration
# Auto-scaling setup for AI-powered CCTV intelligence platform
# Region: us-central1 (Iowa) — primary deployment region

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: vision-os-api
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/ingress-status: all
    run.googleapis.com/launch-stage: stable
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "10"
        autoscaling.knative.dev/target: "80"
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        run.googleapis.com/vpc-access-egress: "private-ranges-only"
        run.googleapis.com/client-name: "vision-os"
    spec:
      containerConcurrency: 80
      timeoutSeconds: 300
      serviceAccountName: vision-os-api-sa
      # VPC connector for secure Cloud SQL access via private IP
      vpcAccess:
        connector: vision-os-vpc-connector
        egress: private-ranges-only
      volumes:
        - name: cloud-sql-proxy
          emptyDir:
            sizeLimit: 1Gi
      containers:
        - image: gcr.io/vision-os/vision-os-api:latest
          ports:
            - containerPort: 8080
          env:
            # Database
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloud-sql-credentials
                  key: database_url
            # Application secrets
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: api-secrets
                  key: secret_key
            # AI services
            - name: GOOGLE_CLOUD_PROJECT
              value: rux-view-497104
            - name: GOOGLE_CLOUD_REGION
              value: us-central1
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ai-service-keys
                  key: groq_api_key
            # Notification services
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: notification-keys
                  key: telegram_bot_token
            - name: SMS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: notification-keys
                  key: sms_api_key
            # Storage & region
            - name: STORAGE_BUCKET
              value: vision-os-clips
            - name: REGION
              value: us-central1
            - name: VISION_OS_ENV
              value: production
            # RTMP ingest (connection_type="rtmp_push" cameras) -- points at
            # the MediaMTX VM in the visionos-platform GCP project (deliberately
            # a different project than this Cloud Run service's rux-view-497104
            # -- see backend/core/ingest/rtmp_ingest.py and android/SETUP.md).
            # Not a secret, just a public IP; no auth on either port yet.
            - name: RTMP_INGEST_PUSH_HOST
              value: "35.193.96.82:1935"
            - name: RTMP_INGEST_RTSP_BASE
              value: "rtsp://35.193.96.82:8554"
          resources:
            limits:
              cpu: "2"
              memory: "2Gi"
          # Startup probe — generous timeout for cold starts with AI models
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          # Liveness probe — ensure the service is responsive
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: cloud-sql-proxy
              mountPath: /cloudsql
