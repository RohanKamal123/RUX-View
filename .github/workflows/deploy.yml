# Vision OS — Deploy to Google Cloud Run
# Runs on push to main (after CI passes)

name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    defaults:
      run:
        working-directory: RUX View

    steps:
      - uses: actions/checkout@v4

      - name: Google Cloud Auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CLOUD_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GOOGLE_CLOUD_PROJECT }}

      - name: Configure Docker
        run: gcloud auth configure-docker

      - name: Build and push container
        run: |
          docker build -t gcr.io/${{ secrets.GOOGLE_CLOUD_PROJECT }}/visionos-backend:${{ github.sha }} .
          docker tag gcr.io/${{ secrets.GOOGLE_CLOUD_PROJECT }}/visionos-backend:${{ github.sha }} \
                   gcr.io/${{ secrets.GOOGLE_CLOUD_PROJECT }}/visionos-backend:latest
          docker push gcr.io/${{ secrets.GOOGLE_CLOUD_PROJECT }}/visionos-backend:${{ github.sha }}
          docker push gcr.io/${{ secrets.GOOGLE_CLOUD_PROJECT }}/visionos-backend:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy visionos-backend \
            --image gcr.io/${{ secrets.GOOGLE_CLOUD_PROJECT }}/visionos-backend:${{ github.sha }} \
            --platform managed \
            --region asia-south1 \
            --allow-unauthenticated \
            --memory 1Gi \
            --cpu 2 \
            --min-instances 0 \
            --max-instances 10 \
            --concurrency 80 \
            --timeout 300 \
            --set-env-vars "ENVIRONMENT=production" \
            --set-env-vars "DATABASE_URL=${{ secrets.DATABASE_URL }}" \
            --set-env-vars "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --set-env-vars "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
            --set-env-vars "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" \
            --set-env-vars "FIREBASE_CREDENTIALS_PATH=/secrets/firebase-credentials.json" \
            --set-secrets "/secrets/firebase-credentials.json=firebase-credentials:latest" \
            --add-cloudsql-instances ${{ secrets.CLOUD_SQL_INSTANCE }}

      - name: Notify deployment success
        run: |
          echo "✅ Vision OS deployed successfully!"
          echo "Revision: ${{ github.sha }}"
          echo "URL: https://visionos-backend-xxxxx-uc.a.run.app"
