<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>CCTV Login</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 380px;
            text-align: center;
        }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 22px; margin-bottom: 8px; color: #38bdf8; }
        p { font-size: 13px; color: #64748b; margin-bottom: 24px; }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            color: #e2e8f0;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
        }
        input[type="password"]:focus { border-color: #38bdf8; }
        button {
            width: 100%;
            padding: 12px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }
        button:hover { background: #7dd3fc; }
        .error {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">📷</div>
        <h2>CCTV Dashboard</h2>
        <p>Enter your password to view visitor logs</p>
        {% if error %}
            <div class="error">⚠️ {{ error }}</div>
        {% endif %}
        <form method="post" action="/login">
            <input type="password" name="password" placeholder="Password" autofocus/>
            <button type="submit">Login →</button>
        </form>
    </div>
</body>
</html>
